services:
  mysql:
    image: mysql:8.0
    container_name: conecta-cras-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: conecta_cras
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Na primeira vez que o banco sobe (volume vazio), cria as tabelas e os dados de exemplo.
      # Se o volume já tem dados, o MySQL ignora este arquivo e nada é apagado.
      - ./backend/config/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # 127.0.0.1 força conexão por rede: só responde quando o MySQL de verdade está pronto,
      # e não o servidor temporário que roda durante a criação inicial do banco.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: conecta-cras-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: conecta-cras-backend
    restart: unless-stopped
    # Segredos (JWT_SECRET, senha do Gmail) ficam só no backend/.env, que não vai para o GitHub.
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: conecta_cras
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Mantém as dependências instaladas dentro do container. Sem esta linha, a pasta
      # backend do computador (que no GitHub não tem node_modules) apagaria elas.
      - /app/node_modules
      - ./frontend:/frontend

volumes:
  mysql_data: